<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Notes des épreuves · 5e et 4e</title>
  <link rel="stylesheet" href="notes.css">
  <script type="module" src="notes.js"></script>
</head>
<body>
  <main>
    <a href="../">Mission Énergie</a>
    <h1>Notes des épreuves</h1>
    <form id="access">
      <label for="code">Code professeur</label>
      <input id="code" type="password" required autocomplete="off" maxlength="43">
      <button type="submit">Ouvrir l’accès</button>
    </form>
    <p id="status" role="status"></p>
    <section id="results" hidden>
      <div class="toolbar">
        <label for="grade-filter">Niveau</label>
        <select id="grade-filter">
          <option value="5e">5e</option>
          <option value="4e">4e</option>
        </select>
        <label for="class-filter">Classe</label>
        <select id="class-filter" disabled><option value="">Toutes les classes</option></select>
        <button type="button" id="refresh">Actualiser</button>
        <button type="button" id="lock">Fermer l’accès</button>
      </div>
      <div id="class-list"></div>
    </section>
  </main>
</body>
</html>
